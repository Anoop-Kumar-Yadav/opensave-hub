name: OpenSave Store Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/**"
      - "submissions/**"
      - "registry/catalog.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack submissions & rebuild catalog.json
        run: node scripts/rebuild-catalog.mjs

      - name: Commit updated catalog & unpacked apps (on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "opensave-bot"
          git config user.email "bot@opensave.local"
          git add apps/ submissions/ registry/catalog.json
          git diff --cached --quiet || git commit -m "chore(store): auto-update catalog.json from submissions"
          git push

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
