<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f6">
  <title>DSA.sheet — Sheet Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/sheet.css">
  <link rel="stylesheet" href="./styles/workspace.css">
  <link rel="stylesheet" href="./styles/algorithms.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <header id="topbar">
    <div class="bar">
      <div class="bar-brand-row">
        <div class="logo">
          <span class="brand-mark">D</span>
          <span>DSA<span class="brand-light">.sheet</span></span>
        </div>
        <button class="btn mobile-menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-label="Toggle tools menu">⋮ Tools</button>
      </div>
      <div class="nav-wrap">
        <button class="nav-scroll-btn" id="nav-prev" type="button" aria-label="Scroll navigation left" hidden>‹</button>
        <nav id="nav" aria-label="Sheets navigation"></nav>
        <button class="nav-scroll-btn" id="nav-next" type="button" aria-label="Scroll navigation right" hidden>›</button>
      </div>
      <div class="bar-actions" id="bar-actions">
        <button class="btn" id="nav-pos" type="button" title="Switch navigation bar position (Top / Left / Right)">Nav: Top</button>
        <button class="btn" id="tpl-btn" type="button" title="Edit Medium & LinkedIn export templates">Templates</button>
        <button class="btn" id="ex" type="button" title="Download backup file">Export</button>
        <button class="btn" id="im" type="button" title="Restore from backup file">Import</button>
        <input type="file" id="fi" accept=".json,application/json" style="display:none">
        <button class="btn" id="ac" type="button" aria-label="Choose accent color">Accent</button>
        <button class="btn" id="th" type="button" aria-label="Toggle theme"></button>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
